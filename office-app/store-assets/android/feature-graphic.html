<!doctype html>
<!-- The Google Play feature graphic (1024 x 500), drawn by make-assets.mjs:
     the app icon, the name and what it is for on the brand navy, with two of
     the phone screenshots in a plain frame (no maker's device or marks). The
     words stay inside the middle of the picture, where Play never crops. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Macaroonie Office feature graphic</title>
<style>
  :root { --navy: #1f2a44; --navy-deep: #151d31; --pink: #f4a7b9; --cream: #fbf3cd; --ink: #ffffff; --soft: #c9d1e3; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1024px; height: 500px; overflow: hidden; background: var(--navy); }
  body { font-family: Inter, 'Helvetica Neue', Arial, sans-serif; color: var(--ink); position: relative; }
  .glow { position: absolute; inset: 0; background:
    radial-gradient(520px 420px at 820px 260px, rgba(244, 167, 185, 0.20), transparent 70%),
    radial-gradient(600px 500px at 120px 520px, rgba(21, 29, 49, 0.9), transparent 70%),
    linear-gradient(135deg, #24314f 0%, var(--navy) 55%, var(--navy-deep) 100%); }
  .words { position: absolute; left: 72px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; gap: 0; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand img { width: 104px; height: 104px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.10); }
  h1 { font-size: 50px; line-height: 1.02; font-weight: 700; letter-spacing: -0.02em; }
  h1 span { display: block; color: var(--pink); }
  .line { margin-top: 30px; font-size: 27px; line-height: 1.25; font-weight: 600; letter-spacing: -0.01em; }
  ul { margin-top: 18px; list-style: none; display: grid; gap: 9px; }
  li { font-size: 18px; color: var(--soft); display: flex; align-items: center; gap: 12px; }
  li::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--pink); flex: none; }
  .phone { position: absolute; width: 214px; height: 438px; border-radius: 34px; background: #0b1020; padding: 9px;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.08); }
  .phone img { width: 100%; height: 100%; border-radius: 26px; display: block; object-fit: cover; object-position: top; }
  .back { left: 606px; top: 56px; transform: rotate(-8deg); }
  .front { left: 748px; top: 36px; transform: rotate(6deg); }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="phone back"><img src="screenshots/02-today.png" alt=""></div>
  <div class="phone front"><img src="screenshots/01-hub.png" alt=""></div>
  <div class="words">
    <div class="brand">
      <img src="../../assets/icon.png" alt="">
      <h1>Macaroonie<span>Office</span></h1>
    </div>
    <p class="line">Run every venue from your phone</p>
    <ul>
      <li>Today's tasks, checks and counts</li>
      <li>Bookings, the rota and deliveries</li>
      <li>Pepper, the assistant you can talk to</li>
    </ul>
  </div>
</body>
</html>

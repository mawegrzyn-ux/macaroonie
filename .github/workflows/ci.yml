name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  database:
    name: Migrate an empty database + start the API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: macaroonie
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/macaroonie
      REDIS_URL: redis://localhost:6379
      AUTH0_DOMAIN: ci.invalid
      AUTH0_AUDIENCE: https://api.ci.invalid
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci
      NODE_ENV: production
      # Production refuses to start without the key that seals stored
      # integration keys (services/vault.js). A throwaway one: this database
      # is empty and gone when the job ends.
      SECRETS_KEY: vUhW9v5ZyUnTlj9XeQ5mgDGTWoA9Y4M4U3ZRAfNgldc=
      # The default (/home/ubuntu/app/uploads) is the server's; the runner
      # can't write there.
      UPLOAD_DIR: /tmp/macaroonie-uploads

    steps:
      - uses: actions/checkout@v4

      # No npm cache and no `npm ci`: package-lock.json isn't in the repo
      # (.gitignore), so install the way the deploy does.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install API dependencies
        working-directory: api
        run: npm install --no-audit --no-fund

      # Every migration from 001 on an empty Postgres 16 (no pg_cron): a new
      # environment or a rebuild from empty must work.
      - name: Migrate an empty database
        working-directory: api
        run: node scripts/migrate.js

      - name: Migrate again (nothing to do)
        working-directory: api
        run: node scripts/migrate.js | tee /tmp/migrate2.log && grep -q "up to date" /tmp/migrate2.log

      - name: Start the API
        working-directory: api
        run: |
          node src/server.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then echo; exit 0; fi
            sleep 1
          done
          cat /tmp/api.log
          exit 1

  # The API's own tests (api/test): the real app with a stand-in login and a
  # stand-in Claude, two tenants made through the API, the cross-tenant
  # sweep, the system-mode paths and Pepper's chat loop. They empty the
  # database, so it is its own one, with "test" in its name (the tests
  # refuse any other). It belongs to a role that isn't a superuser, like
  # production's: superusers skip row-level security, and the tests check
  # it holds.
  api-tests:
    name: API tests (cross-tenant sweep, RLS, Pepper)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']

    env:
      DATABASE_URL: postgres://maca_app:maca_app@localhost:5432/macaroonie_test
      REDIS_URL: redis://localhost:6379
      AUTH0_DOMAIN: ci.invalid
      AUTH0_AUDIENCE: https://api.ci.invalid
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci
      NODE_ENV: test
      UPLOAD_DIR: /tmp/macaroonie-uploads

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install API dependencies
        working-directory: api
        run: npm install --no-audit --no-fund

      - name: A test database owned by a role that isn't a superuser
        run: |
          psql postgres://postgres:postgres@localhost:5432/postgres \
            -c "CREATE ROLE maca_app LOGIN PASSWORD 'maca_app'" \
            -c "CREATE DATABASE macaroonie_test OWNER maca_app"

      - name: Migrate
        working-directory: api
        run: node scripts/migrate.js

      - name: npm test
        working-directory: api
        run: npm test

  shared-tests:
    name: Shared unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: node --test
        run: node --test shared/test/*.test.mjs shared/pos/test/*.test.mjs

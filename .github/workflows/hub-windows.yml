name: Venue hub on Windows

# The Windows installer (hub/install/install.ps1) run for real on a Windows
# machine, against a stand-in cloud (hub/test/windows/standin.mjs): the hub as
# the MacaroonieHub service (compiled there from hub/install/HubService.cs),
# restarts, stopping, the scheduled task fallback, moving a linked hub,
# uninstalling. Once with Windows PowerShell 5.1 (what setup.cmd and a plain
# "PowerShell as administrator" run) and once with PowerShell 7.

on:
  pull_request:
    paths:
      - 'hub/**'
      - 'api/src/services/hubRelease.js'
      - '.github/workflows/hub-windows.yml'
  push:
    branches: [main]
    paths:
      - 'hub/**'
      - 'api/src/services/hubRelease.js'
      - '.github/workflows/hub-windows.yml'
  workflow_dispatch:

jobs:
  install:
    name: Windows installer (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]

    steps:
      - uses: actions/checkout@v4

      # Only for the stand-in cloud: the installer downloads its own Node.js.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start the stand-in cloud
        shell: pwsh
        run: |
          $p = Start-Process -FilePath node -ArgumentList 'hub/test/windows/standin.mjs', '8790' -PassThru -NoNewWindow `
            -RedirectStandardOutput standin.log -RedirectStandardError standin.err
          for ($i = 0; $i -lt 30; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:8790/__calls | Out-Null; Write-Host 'Stand-in cloud is up'; exit 0 } catch { Start-Sleep -Seconds 1 }
          }
          Get-Content standin.log, standin.err -ErrorAction SilentlyContinue
          throw 'the stand-in cloud did not start'

      - name: Install, run, restart, move and remove the hub
        shell: ${{ matrix.shell }}
        run: |
          & ./hub/test/windows/install-test.ps1 -Api http://127.0.0.1:8790
          exit $LASTEXITCODE

      - name: What the stand-in cloud was asked
        if: always()
        shell: pwsh
        run: Get-Content standin.log -Tail 80 -ErrorAction SilentlyContinue
